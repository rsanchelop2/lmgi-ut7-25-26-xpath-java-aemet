<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pronóstico - 15:00</title>
	<style>
		body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 40px; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
		.card { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); max-width: 400px; }
		.fecha { font-size: 0.9rem; color: #999; margin-bottom: 10px; }
		.hora { font-size: 2.5rem; font-weight: bold; color: #667eea; margin: 10px 0; }
		.emoji { font-size: 5rem; margin: 20px 0; }
		.temp { font-size: 3rem; font-weight: bold; color: #333; margin: 20px 0; }
		.desc { font-size: 1.1rem; color: #666; margin: 15px 0; }
		.humedad { font-size: 1rem; color: #007bff; margin-top: 20px; background: #f0f8ff; padding: 15px; border-radius: 8px; }
	</style>
</head>
<body>
	<div class="card">
		<div class="fecha">2026-04-13</div>
		<div class="hora">15:00</div>
		<div class="emoji">🌤️</div>
		<div class="temp">10°C</div>
		<div class="desc">Poco nuboso</div>
		<div class="humedad">💧 Humedad: 68%</div>
	</div>
</body>
</html>
